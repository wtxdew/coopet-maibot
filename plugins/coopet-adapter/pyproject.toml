# 只用于本地开发和测试；MaiBot 装插件时读 _manifest.json，不读这里。
# 版本与目标 MaiBot 1.4.3 容器里的一致。
[project]
name = "coopet-adapter-dev"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "maibot-plugin-sdk==2.22.1",
  "aiohttp==3.14.5",
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
