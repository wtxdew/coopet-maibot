# 把 build/app（scripts/pack.mjs 拼出来的应用目录）打包成 macOS 的 .dmg / .zip 或 Windows 的安装包。
# pack.mjs 以 build/app 为项目目录运行 electron-builder，所以这里的相对路径从 build/app 算起，
# node_modules 用的是 build/app 里 npm 装好的那份（按目标平台和架构）。
appId: app.coopet.desktop
productName: Coopet
copyright: Copyright © 2026 Coopet contributors
electronVersion: 44.4.4
directories:
  output: ../../dist
  buildResources: packages/coopet-app/icons
# 核心用 tsx 直接运行 TypeScript 源码，还要启动 esbuild、koffi、pnpm：文件不压缩进 asar（和 Coopanion 一样）
asar: false
npmRebuild: false
nodeGypRebuild: false
files:
  - "**/*"
# 自动更新（packages/coopet-app/updater.cjs）去哪里找新版本。pack.mjs 用 --publish never 打包，这里只让 electron-builder
# 在安装包旁边生成 latest.yml（Windows）/ latest-mac.yml，并把 app-update.yml 写进应用；发布时把它们和安装包一起传到 Release。
# 更新器和标题栏只认正式 Release，不认 pre-release
publish:
  provider: github
  owner: wtxdew
  repo: coopet-maibot
# 不签名的个人构建：macOS 用临时签名（"-"，Apple 芯片上必须有签名才能运行），第一次打开要在
# 「系统设置 → 隐私与安全性」里点「仍要打开」；不进 Dock（LSUIElement），只在菜单栏有图标。
mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.lifestyle
  icon: packages/coopet-app/icons/icon.png
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: Coopet-${version}-mac-${arch}.${ext}
  extendInfo:
    LSUIElement: true
    # 「本地网络」权限的说明：从访达打开的应用连局域网（MaiBot 所在的主机）要用户授权，
    # 没有这句说明时系统不弹授权框、直接拒绝连接（表现为连接立即以 1006 断开）
    NSLocalNetworkUsageDescription: Coopet 要连接你局域网里的 MaiBot。
    # 「麦克风」权限的说明（语音输入）：没有这句时系统直接拒绝录音，不弹授权框。
    # 说话键要的「输入监控」没有对应的说明键，系统第一次读键盘时自己会问
    NSMicrophoneUsageDescription: Coopet 要用麦克风听你说话，识别在本机进行。
dmg:
  writeUpdateInfo: false
# Windows：按用户安装（不要管理员权限），可以选安装位置；不签名，第一次运行 SmartScreen 会拦一下，点「仍要运行」。
win:
  target:
    - target: nsis
      arch: [x64]
  icon: packages/coopet-app/icons/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Coopet
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Coopet-Setup-${version}.exe
